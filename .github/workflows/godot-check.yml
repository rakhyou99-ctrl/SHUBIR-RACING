name: Godot project check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify Android gameplay configuration
        shell: bash
        run: |
          grep -Fq 'window/handheld/orientation=0' project.godot
          grep -Fq 'sensors/enable_accelerometer=true' project.godot
          grep -Fq 'screen/orientation=0' export_presets.cfg
          grep -Fq 'config/icon="res://Assets/icon.png"' project.godot
          grep -Fq 'launcher_icons/main_192x192="res://Assets/icon.png"' export_presets.cfg
          test -s Assets/icon.png
          ruby -e 'data = File.binread("Assets/icon.png"); abort "Assets/icon.png is not a PNG" unless data.start_with?([137, 80, 78, 71, 13, 10, 26, 10].pack("C*")); width, height = data.byteslice(16, 8).unpack("N2"); puts "Launcher icon: #{width}x#{height}"; abort "Launcher icon must be at least 192x192" if width < 192 || height < 192'
          grep -Fq 'config/name="SHUBIR RACING"' project.godot
          grep -Fq 'run/main_scene="res://Scenes/main_menu.tscn"' project.godot
          grep -Fq 'renderer/rendering_method.mobile="gl_compatibility"' project.godot
          for required_file in Scenes/main_menu.tscn Scenes/garage.tscn Scenes/settings.tscn Scenes/race.tscn Scripts/main_menu.gd Scripts/garage.gd Scripts/settings.gd Scripts/race.gd Scripts/game_state.gd; do
            test -s "$required_file" || { echo "Missing required game file: $required_file"; exit 1; }
          done
          grep -Fq 'package/unique_name="com.shubir.racing"' export_presets.cfg
          grep -Fq 'architectures/arm64-v8a=true' export_presets.cfg
          grep -Fq 'architectures/armeabi-v7a=false' export_presets.cfg
          grep -Fq 'release_ready:' .github/workflows/android-apk.yml
          grep -Fq 'default: false' .github/workflows/android-apk.yml
          grep -Fq 'type: boolean' .github/workflows/android-apk.yml
          grep -Fq 'inputs.release_ready == true' .github/workflows/android-apk.yml
          grep -Fq 'SHUBIR_RELEASE_KEYSTORE_BASE64' .github/workflows/android-apk.yml
          grep -Fq 'SHUBIR_RELEASE_KEYSTORE_PASSWORD' .github/workflows/android-apk.yml
          grep -Fq 'SHUBIR_RELEASE_KEY_ALIAS' .github/workflows/android-apk.yml
          grep -Fq 'GODOT_ANDROID_KEYSTORE_RELEASE_PATH' .github/workflows/android-apk.yml
          grep -Fq -- '--export-release' .github/workflows/android-apk.yml
          grep -Fq '/build/' .gitignore
          grep -Fq '*.apk' .gitignore
          grep -Fq '*.keystore' .gitignore
          grep -Fq '*.jks' .gitignore
          grep -Fq 'cmdline-tools;latest' .github/workflows/android-apk.yml
          grep -Fq 'build-tools;35.0.1' .github/workflows/android-apk.yml
          grep -Fq 'GODOT_ANDROID_KEYSTORE_DEBUG_PATH=' .github/workflows/android-apk.yml
          grep -Fq 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=' .github/workflows/android-apk.yml
          grep -Fq 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=' .github/workflows/android-apk.yml
          echo "Landscape, accelerometer, Android package/ABI, SDK, signing, and final-release APK gate verified"

      - name: Validate imported sports car GLB asset
        shell: bash
        run: |
          set -euo pipefail
          test -s Assets/Cars/spectral_gt_rs_game_ready.glb
          ruby -rjson -e '
            data = File.binread("Assets/Cars/spectral_gt_rs_game_ready.glb")
            abort "Invalid GLB magic" unless data.byteslice(0, 4) == "glTF"
            magic, version, length = data.byteslice(0, 12).unpack("a4V2")
            abort "Unsupported GLB version: #{version}" unless version == 2
            abort "GLB length mismatch: header=#{length}, actual=#{data.bytesize}" unless length == data.bytesize
            chunk_length, chunk_type = data.byteslice(12, 8).unpack("V2")
            abort "Missing GLB JSON chunk" unless chunk_type == 0x4E4F534A
            document = JSON.parse(data.byteslice(20, chunk_length).force_encoding("UTF-8").strip)
            abort "GLB asset version is not 2.0" unless document.dig("asset", "version") == "2.0"
            abort "GLB has no meshes" if document.fetch("meshes", []).empty?
            nodes = document.fetch("nodes", [])
            abort "GLB has no scene nodes" if nodes.empty?
            node_names = nodes.map { |node| node.fetch("name", "") }
            %w[part_015_ part_030_ part_045_ part_060_].each do |prefix|
              abort "GLB wheel group missing: #{prefix}" unless node_names.any? { |name| name.start_with?(prefix) }
            end
            wheel_meshes = document.fetch("meshes", []).map { |mesh| mesh.fetch("name", "").downcase }
            %w[wide\ performance\ tire forged\ alloy\ rim wheel\ hub ventilated\ brake\ disc].each do |part|
              abort "GLB wheel component missing: #{part}" unless wheel_meshes.any? { |name| name.include?(part) }
            end
            body_node = nodes.find { |node| node.fetch("name", "").start_with?("part_000_") }
            abort "GLB body node missing" unless body_node
            body_mesh = document.fetch("meshes")[body_node.fetch("mesh")]
            body_position = document.fetch("accessors")[body_mesh.fetch("primitives").first.fetch("attributes").fetch("POSITION")]
            abort "GLB body bounds missing" unless body_position["min"] && body_position["max"]
            puts "GLB v#{version}: #{document["meshes"].length} meshes, #{nodes.length} nodes; four wheel groups and Z-up body bounds verified"
          '
      - name: Import project and check scripts
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="$RUNNER_TEMP/godot-import.log"
          if ! godot --headless --editor --path . --quit >"$LOG_FILE" 2>&1; then
            cat "$LOG_FILE"
            exit 1
          fi
          cat "$LOG_FILE"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' "$LOG_FILE"; then
            echo "Godot reported script/import errors."
            exit 1
          fi

      - name: Smoke-test every game screen
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="$RUNNER_TEMP/game-screen-smoke.log"
          if ! timeout --signal=TERM --kill-after=15s 300s godot --verbose --headless --path . --script Scripts/smoke_test.gd >"$LOG_FILE" 2>&1; then
            cat "$LOG_FILE"
            exit 1
          fi
          cat "$LOG_FILE"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' "$LOG_FILE"; then
            echo "Godot reported errors during runtime scene smoke tests."
            exit 1
          fi
