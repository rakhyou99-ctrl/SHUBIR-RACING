name: Godot project check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify Android gameplay configuration
        shell: bash
        run: |
          grep -Fq 'window/handheld/orientation=0' project.godot
          grep -Fq 'sensors/enable_accelerometer=true' project.godot
          grep -Fq 'screen/orientation=0' export_presets.cfg
          grep -Fq 'release_ready:' .github/workflows/android-apk.yml
          grep -Fq 'default: false' .github/workflows/android-apk.yml
          grep -Fq 'type: boolean' .github/workflows/android-apk.yml
          echo "Landscape, accelerometer, and final-release APK gate verified"

      - name: Import project and check scripts
        run: godot --headless --editor --path . --quit

      - name: Smoke-test every game screen
        shell: bash
        run: |
          for scene in main_menu garage settings race; do
            echo "Smoke-testing res://Scenes/${scene}.tscn"
            godot --headless --path . "res://Scenes/${scene}.tscn" --quit-after 5
          done

      - name: Run gameplay collision logic tests
        run: godot --headless --path . --script res://Tests/gameplay_logic_test.gd
