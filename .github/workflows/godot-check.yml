name: Godot project check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project and check scripts
        run: godot --headless --editor --path . --quit

      - name: Smoke-test every game screen
        shell: bash
        run: |
          for scene in main_menu garage settings race; do
            echo "Smoke-testing res://Scenes/${scene}.tscn"
            godot --headless --path . "res://Scenes/${scene}.tscn" --quit-after 5
          done
