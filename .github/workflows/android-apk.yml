name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot 4.7.2 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Install Android build template
        shell: bash
        run: |
          godot --headless --editor --path . --install-android-build-template
          echo "Checking Android build template files..."
          if [ ! -d android/build ]; then
            echo "Android build template was not created. Project files:"
            find . -maxdepth 3 -type d -print | sort | head -n 100
            exit 1
          fi
          ls -la android/build

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/SHUBIR-RACING.apk
          test -s build/SHUBIR-RACING.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHUBIR-RACING-Android-APK
          path: build/SHUBIR-RACING.apk
          if-no-files-found: error
